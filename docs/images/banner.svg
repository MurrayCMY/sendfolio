<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="SendFolio: see who reads your documents, page by page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a33"/>
      <stop offset="1" stop-color="#3949ab"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8f9bea"/>
      <stop offset="1" stop-color="#d7dcff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="210" fill="#ffffff" opacity=".06"/>
  <circle cx="1230" cy="330" r="150" fill="#ffffff" opacity=".05"/>

  <!-- mark -->
  <g transform="translate(88 78) scale(2.6)" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 4h10l6 6v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/>
    <path d="M19 4v6h6"/>
    <path d="M11.5 17h9M11.5 21.5h6"/>
  </g>
  <text x="196" y="150" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-1">SendFolio</text>
  <text x="90" y="226" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#e3e7ff">See who reads your documents,</text>
  <text x="90" y="268" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="500" fill="#e3e7ff">page by page.</text>
  <text x="90" y="318" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#aab3e8">Free · Self-hosted · Open source · English &amp; 简体中文</text>

  <!-- heat-map motif -->
  <g transform="translate(760 70)">
    <rect x="0" y="0" width="450" height="226" rx="16" fill="#ffffff" opacity=".10"/>
    <g>
      <rect x="34"  y="104" width="38" height="86"  rx="6" fill="url(#bar)" opacity=".75"/>
      <rect x="86"  y="84"  width="38" height="106" rx="6" fill="url(#bar)" opacity=".8"/>
      <rect x="138" y="116" width="38" height="74"  rx="6" fill="url(#bar)" opacity=".75"/>
      <rect x="190" y="42"  width="38" height="148" rx="6" fill="url(#bar)"/>
      <rect x="242" y="96"  width="38" height="94"  rx="6" fill="url(#bar)" opacity=".8"/>
      <rect x="294" y="132" width="38" height="58"  rx="6" fill="url(#bar)" opacity=".7"/>
      <rect x="346" y="150" width="38" height="40"  rx="6" fill="url(#bar)" opacity=".65"/>
      <rect x="398" y="164" width="22" height="26"  rx="6" fill="url(#bar)" opacity=".6"/>
    </g>
    <text x="34" y="34" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Time on each page</text>
    <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#c6ccf5" text-anchor="middle">
      <text x="53" y="212">1</text><text x="105" y="212">2</text><text x="157" y="212">3</text><text x="209" y="212">4</text>
      <text x="261" y="212">5</text><text x="313" y="212">6</text><text x="365" y="212">7</text><text x="409" y="212">8</text>
    </g>
  </g>
</svg>
